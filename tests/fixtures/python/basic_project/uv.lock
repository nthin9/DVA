version = 1
revision = 3
requires-python = ">=3.10"
resolution-markers = [
    "python_full_version >= '3.11'",
    "python_full_version < '3.11'",
]

[[package]]
name = "basic-project"
version = "1.0"
source = { virtual = "." }
dependencies = [
    { name = "requests" },
    { name = "tomli", marker = "python_full_version < '3.11'" },
]

[package.optional-dependencies]
socks = [
    { name = "pysocks" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]
test = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "pysocks", marker = "extra == 'socks'", specifier = ">=1.7" },
    { name = "requests", specifier = ">=2.31,<3" },
    { name = "tomli", marker = "python_full_version < '3.11'", specifier = ">=2" },
]
provides-extras = ["socks"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8" },
    { name = "ruff" },
]
test = [{ name = "pytest", specifier = ">=8" }]

